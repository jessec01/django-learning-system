services:
  proxy:
    image: nginx:1.29.3
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64
  db:
    image: postgres:15
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -U  ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64
  web:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend_net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64
networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
